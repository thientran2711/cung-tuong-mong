      [['namchieu_a18_s1','Nam Chiếu'],['bacdich_a18_s1','Bắc Địch']].map(([f,n])=>`<button class="card" type="button" data-p="${f}" data-n="${n}"><img src="x/${f}.webp" alt="${n}" style="width:100%"><span>${n}<small>mẫu a18, chờ sếp duyệt</small></span></button>`).join('')+`</div>`;
  } else {
    const k=P.indexOf(id), prev=P[(k+P.length-1)%P.length], next=P[(k+1)%P.length], S=seq(a,id);
    const card=(e,i)=>{const th=e.k==='r'?`background-image:url('${a}/${id}.webp');background-position:0 ${pos(e.t)}`:cellBg(a,id,e.i);
      return `<button class="card" type="button" data-i="${i}" aria-label="${lbl(id)} ${e.n}"><div class="thumb ${e.k==='r'?'':'one'}" style="${th}"></div><span>${e.n.replace(/^t\d /,'')}<small>${e.n.match(/^t\d/)?e.n.slice(0,2):''}</small></span></button>`};
    const st=[],rk=[];S.forEach((e,i)=>(e.k==='s'&&e.t==null?st:rk).push(card(e,i)));
    h=`<h2>${ALBL[a]} · <b>${lbl(id)}</b></h2>`+(st.length?`<h3 class="sec">Thiếu nữ · Nhà nghèo · Trung y · Lãnh cung</h3><div class="grid">${st.join('')}</div>`:'')+(rk.length?`<h3 class="sec">Các bậc</h3><div class="grid">${rk.join('')}</div>`:'')+
      `<div class="pager"><a href="#${a}/${prev}">← ${lbl(prev)}</a><a href="#${a}/${next}">${lbl(next)} →</a></div>`;
  }
  view.innerHTML=h;
  view.querySelectorAll('button.card').forEach(b=>b.onclick=()=>b.dataset.p?openPrincess(b.dataset.p,b.dataset.n):open(a,id,+b.dataset.i));
  lb.hidden=true; window.scrollTo(0,0);
}
addEventListener('hashchange',show); show();
</script>

</body></html>
