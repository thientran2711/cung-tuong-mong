  } else if(id==='congchua'){
    h=`<h2>Công chúa <b>Nam Chiếu</b> · <b>Bắc Địch</b></h2><div class="grid">`+
      [['namchieu_a18_s1','Nam Chiếu'],['bacdich_a18_s1','Bắc Địch']].map(([f,n])=>`<button class="card" type="button" data-p="${f}" data-n="${n}"><img src="x/${f}.webp" alt="${n}" style="width:100%"><span>${n}<small>mẫu a18, chờ sếp duyệt</small></span></button>`).join('')+`</div>`;
  } else {
    const k=P.indexOf(id), prev=P[(k+P.length-1)%P.length], next=P[(k+1)%P.length];
    h=`<h2>${ALBL[a]} · <b>${id.toUpperCase()}</b></h2><div class="grid">`;
    ranksOf(a,id).forEach(t=>{h+=`<button class="card" type="button" data-t="${t}" aria-label="${id} t${t} ${RANKS[t-1]}: xem 3 bộ đồ"><div class="thumb" style="background-image:url('${a}/${id}.webp');background-position:0 ${pos(t)}"></div><span>t${t}<small>${RANKS[t-1]}</small></span></button>`;});
    h+=`</div><div class="pager"><a href="#${a}/${prev}">← ${lbl(prev)}</a><a href="#${a}/${next}">${lbl(next)} →</a></div>`;
  }
  view.innerHTML=h;
  view.querySelectorAll('button.card').forEach(b=>b.onclick=()=>b.dataset.p?openPrincess(b.dataset.p,b.dataset.n):open(a,id,+b.dataset.t));
  lb.hidden=true; window.scrollTo(0,0);
}
addEventListener('hashchange',show); show();
</script>

</body></html>
