<!doctype html><meta charset=utf-8><body style="margin:0;background:#f4ead8"><canvas id=c></canvas>
<script src="mk_extract.js"></script><script src="emo_warp.js"></script>
<script>
const FILES=["por-player-look1-t3-a18.webp","por-consort-c05-t4-a18.webp"];
const WHO=["Nàng","Phi tần"];
const LOOKS=[["vua","Đoan trang"],["tuyet","Khuynh thành"]];
const EMO=[["Bình thường",{}],["Vui",{vui:1}],["Buồn",{buon:1}],["Giận",{gian:1}],["Hờn",{hon:1}],["Khóc",{khoc:1,eye:"205,105,115,.55"}]];

function mk2K(v){const P=toilMkPts(v);const mean=a=>a.reduce((s,p)=>[s[0]+p[0]/a.length,s[1]+p[1]/a.length],[0,0]);
 let A={U:P.slice(20,27),Lo:P.slice(27,30),Bu:P.slice(40,45)},B={U:P.slice(30,37),Lo:P.slice(37,40),Bu:P.slice(50,55)};
 if(mean(A.U)[0]>mean(B.U)[0]){const t=A;A=B;B=t}
 const lip=P.slice(0,12),lc=mean(lip);const byx=[...lip].sort((a,b)=>a[0]-b[0]);const mL=byx[0],mR=byx[11];
 const up=lip.filter(p=>p[1]<lc[1]).sort((a,b)=>a[0]-b[0]),lo=lip.filter(p=>p[1]>=lc[1]).sort((a,b)=>a[0]-b[0]);
 const near=(arr)=>[...arr].sort((a,b)=>Math.abs(a[0]-lc[0])-Math.abs(b[0]-lc[0]))[0]||lc;
 const pick=(arr,f)=>arr.length?arr[Math.min(arr.length-1,Math.max(0,Math.round(f*(arr.length-1))))]:lc;
 const ea=mean(A.U),eb=mean(B.U);const u=Math.hypot(ea[0]-eb[0],ea[1]-eb[1]);const F=2.15*u;const cx=(ea[0]+eb[0])/2,ey=(ea[1]+eb[1])/2;
 const eye=E=>({o:E.U[0],i:E.U[6],t:E.U[3],b:E.Lo[1]});const e1=eye(A),e2=eye(B);
 const pts={mL,mR,uL:near(up),lL:near(lo),bLi:A.Bu[4],bLm:A.Bu[2],bLo:A.Bu[0],bRi:B.Bu[4],bRm:B.Bu[2],bRo:B.Bu[0],eLo:e1.o,eLi:e1.i,eLt:e1.t,eLb:e1.b,eRo:e2.o,eRi:e2.i,eRt:e2.t,eRb:e2.b,
  fL:[cx-F/2,ey],fR:[cx+F/2,ey],fh:[cx,ey-1.0*u],chin:[cx,lc[1]+1.0*u],nose:[cx,(ey+lc[1])/2+.1*u],mUL:pick(up,.25),mUR:pick(up,.75),mLL:pick(lo,.25),mLR:pick(lo,.75)};
 const o=[];KIT_EXPR.K.forEach(k=>{o.push(+pts[k][0].toFixed(3),+pts[k][1].toFixed(3))});return o}

const L=(u)=>new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=u});
(async()=>{
 const D=await (await fetch("data.json")).json();KIT_EXPR.lm={};for(const f in D.mk)KIT_EXPR.lm[f]=mk2K(D.mk[f]);
 const TW=290,TH=330,LW=200,HH=80,TT=60;
 const cv=document.getElementById("c");cv.width=LW+TW*4;cv.height=TT+HH+TH*EMO.length;const g=cv.getContext("2d");
 g.fillStyle="#f4ead8";g.fillRect(0,0,cv.width,cv.height);g.fillStyle="#6e4d0e";g.font="bold 30px 'DejaVu Sans',sans-serif";g.fillText("Mặt cảm xúc · bản A (bóp méo bằng code, đã đậm hơn)",16,40);
 let col=0;const COL={mat:"hoadao",ma:"hongphan",son:"haiduong",may:"nau",seed:0};
 for(let fi=0;fi<2;fi++){const f=FILES[fi];const im=await L(f);const W=im.naturalWidth,H=im.naturalHeight;
  const P=KIT_EXPR.pts(f,W,H);const F=Math.hypot(P.fR[0]-P.fL[0],P.fR[1]-P.fL[1]);const cx=(P.fL[0]+P.fR[0])/2;
  const sx=cx-1.25*F,sw=2.5*F,sy=P.fh[1]-.55*F,sh=sw*TH/TW;
  for(let li=0;li<2;li++){
   // makeup composite
   const base=document.createElement("canvas");base.width=W;base.height=H;const b=base.getContext("2d");b.drawImage(im,0,0);
   const box=toilMkBox(D.mk[f]);const url=toilMkDraw(im,D.mk[f],LOOKS[li][0],COL,box,D.fit[f]);const mk=await L(url);
   b.drawImage(mk,box[0]/100*W,box[1]/100*H,box[2]/100*W,box[3]/100*H);
   const x=LW+col*TW;g.fillStyle="#6e4d0e";g.font="bold 24px 'DejaVu Sans',sans-serif";g.textAlign="center";g.fillText(WHO[fi],x+TW/2,TT+28);g.font="22px 'DejaVu Sans',sans-serif";g.fillText(LOOKS[li][1],x+TW/2,TT+58);g.textAlign="left";
   for(let ei=0;ei<EMO.length;ei++){
    const y=TT+HH+ei*TH;const t=document.createElement("canvas");t.width=W;t.height=H;const tg=t.getContext("2d");tg.drawImage(base,0,0);
    if(Object.keys(EMO[ei][1]).length){const m=KIT_EXPR.make(base,f,EMO[ei][1]);if(m){const r=m.rect;tg.drawImage(m.cv,r[0]/100*W,r[1]/100*H,r[2]/100*W,r[3]/100*H)}}
    g.save();g.beginPath();g.rect(x+4,y+4,TW-8,TH-8);g.clip();g.imageSmoothingQuality="high";g.drawImage(t,sx,sy,sw,sh,x+4,y+4,TW-8,TH-8);g.restore();
    g.strokeStyle="#c9a227";g.lineWidth=2;g.strokeRect(x+4,y+4,TW-8,TH-8);
    if(col===0){g.fillStyle="#6e4d0e";g.font="bold 26px 'DejaVu Sans',sans-serif";g.fillText(EMO[ei][0],10,y+TH/2)}
   }
   col++;}}
 window.DONE=cv.toDataURL("image/png");
})().catch(e=>{window.ERR=String(e&&e.stack||e)});
</script>
