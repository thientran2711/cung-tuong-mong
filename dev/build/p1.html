<title>Cung Tường Mộng</title>
<link rel="icon" href="__ICON__">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&family=Be+Vietnam+Pro:wght@400;600&display=swap">
<style>
/* One full-screen game screen: HUD on top, scene stage, a tabbed panel, a bottom bar with tabs and the turn button. Landscape puts stage and panel side by side. */
:root{
  --bg:#f5ecdc; --panel:#fffaf0; --panel2:#f6ead6; --line:#d2b071; --gold:#8f5f0c; --trim:#d9b25f; --red:#c23b22; --ink:#2a1a12; --dim:#6b5643; --good:#2d7a52; --bad:#c23b22;
  --jade:#5fa58c; --peony:#e48aa4; --sky:#e8f1f2;
  --rel-them:#7a4fa0; --rel-me:#2f6f9f; /* relation direction (KIT §11.2): người khác → ta purple, ta → người khác blue; never green/red */
  --display:"Noto Serif",Georgia,serif; --body:"Be Vietnam Pro",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.g{color:var(--good)} .r{color:var(--bad)}
.game{height:100vh;height:100dvh;display:grid;gap:6px;
  grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) minmax(0,44%) auto;grid-template-areas:"hud" "stage" "panel" "bar";
  padding:max(6px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));
  background-image:radial-gradient(circle at 15% -10%,#fbe3e6 0,transparent 45%),radial-gradient(circle at 90% 0,#e3f1ea 0,transparent 40%)}
/* KIT §0 SPREAD (html.kv2, rot.js KIT_FRAME): two EQUAL pages (LEFT room/stage, RIGHT open tab) meeting at the book binding (jbook), so each
   page box is 582 px = the one-page (kv1) page box (590 canvas, 4 px margins): the Fold page is the iPad right page scaled (owner 16/11 07:47Z/07:50Z) */
html.kv1 .game{padding-left:max(4px,env(safe-area-inset-left));padding-right:max(4px,env(safe-area-inset-right))}
html.kv2 .game{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"hud hud" "stage panel" "bar bar"}
/* HUD */
.hud{grid-area:hud;display:flex;align-items:center;gap:6px;padding:4px 6px;background:linear-gradient(var(--panel2),var(--panel));border:1px solid var(--line);border-radius:8px;min-width:0}
.me{display:flex;align-items:center;gap:5px;min-width:0;max-width:38%;background:none;border:0;text-align:left;cursor:pointer;padding:2px 4px;min-height:40px;border-radius:6px}
.mi{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.me b{font-family:var(--display);color:var(--gold);font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.me .rk{font-size:.72rem;border:1px solid var(--gold);border-radius:9px;padding:0 6px;color:var(--gold);white-space:nowrap}
.me .dt{font-size:.72rem;color:var(--dim);white-space:nowrap}
.mini{width:100%;height:3px;background:#2a1a1222;border-radius:2px;overflow:hidden}.mini u{display:block;height:100%;background:var(--gold);transition:width .4s}
.emp{display:flex;align-items:center;gap:5px;background:#fff8;border:1px solid var(--line);border-radius:8px;padding:2px 6px;cursor:pointer;min-height:40px;max-width:30%;min-width:0}
.emp .md{width:30px;height:30px;font-size:.95rem;border-width:2px}
.emp div{display:flex;flex-direction:column;min-width:0;text-align:left}
.emp b{font-size:.78rem;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emp span{font-size:.72rem;white-space:nowrap}
@media (max-width:560px){.hud{flex-wrap:wrap;row-gap:2px}.me{max-width:none;flex:1}.emp{max-width:44%}}
.md{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;font-family:var(--display);font-size:1.25rem;color:#fff8e8;background:radial-gradient(circle at 40% 35%,#b0584a,#5a1e16);border:3px solid var(--c,var(--trim));box-shadow:0 0 0 2px #fff,0 2px 8px #5a3a2066;overflow:hidden}
.md img{width:100%;height:100%;object-fit:cover;display:block}
.md.sm{width:34px;height:34px;font-size:.95rem;border-width:2px}
.md.big{width:84px;height:84px;font-size:2rem}
.rival .md.sm{margin-right:4px}
/* stage */
.stage{grid-area:stage;position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:0}
.stage::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(transparent,#fff6e866);pointer-events:none}
.scene-t{position:absolute;left:8px;top:8px;right:8px;z-index:1;background:#fffaf0d9;border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.scene-t h2{font-family:var(--display);color:var(--gold);font-size:1.08rem;margin:0}
.scene-t p{margin:2px 0 0;font-size:.85rem;color:var(--ink);max-width:560px}
.tokens{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;align-items:flex-end;gap:8px;flex-wrap:wrap;padding:0 8px;z-index:1}
.tok{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;cursor:pointer;min-width:60px;padding:2px;border-radius:8px}
.tok:hover .md{transform:translateY(-2px)} .tok .md{transition:transform .15s}
.tok .tag{font-size:.78rem;background:#fffaf0;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:1px 6px;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--dim);font-size:.85rem;margin:0;background:#fffaf0cc;border-radius:6px;padding:2px 8px}
#tokens>.empty{display:none}/* an empty room already says so in the room's visit line (.rmsg: "Không gặp ai."); this second copy sat over the room title at 844x390 */
.pop{position:absolute;left:8px;right:8px;bottom:8px;max-height:calc(100% - 16px);overflow:auto;background:linear-gradient(var(--panel2),var(--panel));border:1px solid var(--gold);border-radius:8px;padding:8px 10px;z-index:3;box-shadow:0 6px 20px #5a3a2055}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:6px}
.ptop b{font-family:var(--display);color:var(--gold)}
.x{background:none;border:1px solid var(--line);border-radius:6px;min-width:40px;min-height:40px;cursor:pointer}
.opts{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.opt{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 9px;text-align:left;cursor:pointer;min-height:42px}
.opt:hover:not(:disabled){border-color:var(--gold)} .opt:disabled{opacity:.4;cursor:default}
.opt small{display:block;color:var(--dim);font-size:.76rem}
.sc-home{background:radial-gradient(ellipse at 50% 120%,#f3c9b8 0,transparent 55%),repeating-linear-gradient(90deg,#fbf1e2 0 46px,#f1dfc6 46px 50px)}
.sc-vuon{background:radial-gradient(ellipse at 72% 90%,#9fd3c4 0 17%,transparent 18%),radial-gradient(circle at 16% 34%,#f4a7bb 0 2.5%,transparent 3.5%),radial-gradient(circle at 27% 24%,#f7c2d0 0 2%,transparent 3%),radial-gradient(circle at 82% 30%,#f4a7bb 0 2.5%,transparent 3.5%),radial-gradient(circle at 60% 18%,#fbd6df 0 1.8%,transparent 2.8%),linear-gradient(#dff0f5,#eef6ea 55%,#bfe0b8)}
.sc-thu{background:linear-gradient(#f7ead3,#ecd5b0),repeating-linear-gradient(0deg,#f3e2c4 0 26px,#e2c79a 26px 29px)}
.sc-dtd{background:repeating-linear-gradient(90deg,transparent 0 16%,#d0574022 16% 19%,transparent 19% 33%),linear-gradient(#fbe7d6,#f2c9ad)}
.sc-tn{background:radial-gradient(circle at 50% 30%,#e7d4f0,transparent 60%),linear-gradient(#f6eefa,#eadcef)}
.sc-kn{background:radial-gradient(circle at 50% 35%,#f8df9e,transparent 55%),linear-gradient(#fdf0d9,#f4d3b8)}
.sc-rv{background:radial-gradient(circle at 50% 40%,#fad3dc,transparent 60%),linear-gradient(#fdf1f3,#f6dbe2)}
.sc-tyv{background:radial-gradient(circle at 30% 40%,#d5ecd9,transparent 60%),repeating-linear-gradient(90deg,#eef6ea 0 30px,#dcebd6 30px 33px)}
.sc-ksp{background:repeating-linear-gradient(90deg,#f4e6cf 0 12px,#e6d1ae 12px 15px)}
.sc-lc{background:radial-gradient(circle,#ffffff 0 1.5px,transparent 2.5px) 0 0/22px 22px,linear-gradient(#dfe6ec,#c9d3dc)}
/* panel */
.panel{grid-area:panel;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;overflow:auto;min-height:0;overscroll-behavior:contain}
.panel h3{font-family:var(--display);color:var(--gold);font-size:1rem;margin:0 0 6px}
.ph{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;align-items:baseline;margin-bottom:6px;font-size:.85rem;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.chip{font-size:.75rem;border:1px solid var(--line);border-radius:10px;padding:1px 7px;color:var(--dim)}
.chip b{color:var(--ink);font-weight:600}
.chip.hot{border-color:var(--red);color:var(--bad)} .chip.ok{border-color:#4e7a4a;color:var(--good)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:6px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0;min-height:44px;transition:transform .15s,border-color .15s}
.card:hover:not(:disabled){transform:translateY(-2px);border-color:var(--gold)}
.card:disabled{opacity:.4;cursor:default}
.card h4{font-family:var(--display);margin:0;font-size:.95rem;color:var(--gold)}
.card p{margin:0;color:var(--dim);font-size:.78rem;line-height:1.3}
.fx{font-size:.76rem;font-variant-numeric:tabular-nums;line-height:1.3}
.odds{font-size:.72rem;background:#f3dfb4;border-radius:3px;padding:0 6px;align-self:flex-start;color:var(--gold)}
.rival{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:5px;margin-bottom:6px}
.rival.out{opacity:.45}
.rival .top{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;align-items:baseline}
.rival .top b{font-family:var(--display)} .rival .top em{font-style:normal;color:var(--gold);font-size:.82rem}
.gh{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--dim)}
.gh .mini{flex:1;max-width:160px;height:5px}.gh .mini u{background:var(--bad)}
.rbtn{display:flex;flex-wrap:wrap;gap:4px}
.rbtn button,.btn{background:#fffaf0;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:.8rem;cursor:pointer;text-align:left;min-height:40px}
.rbtn button:hover:not(:disabled),.btn:hover:not(:disabled){border-color:var(--gold)}
.rbtn button:disabled,.btn:disabled{opacity:.35;cursor:default}
.rbtn small,.btn small{display:block;color:var(--dim);font-size:.7rem}
.arts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.art{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px;display:flex;flex-direction:column;gap:3px;min-width:0}
.art b{font-family:var(--display);color:var(--gold);font-size:.92rem}
.art .lv{font-size:.8rem} .art .u{font-size:.72rem;color:var(--dim)}
.req{font-size:.85rem;line-height:1.6}.req .y{color:var(--good)}.req .n{color:var(--bad)}
.story{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;font-size:.88rem}
.logs{font-size:.82rem;color:var(--dim);line-height:1.45}.logs div{padding:2px 0;border-bottom:1px solid #d2b07155}.logs div:first-child{color:var(--ink)}
.ld{color:var(--gold);font-size:.72rem;margin-right:4px}
.past{font-size:.8rem;color:var(--dim);line-height:1.55}
/* bar */
.bar{grid-area:bar;display:flex;gap:6px;align-items:stretch;min-width:0}
.tabs{flex:1;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;min-height:44px;padding:4px 9px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--dim);font-size:.85rem;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{color:#fff;background:var(--gold);border-color:var(--gold);font-weight:600}
.main{background:var(--red);color:#fff;border:1px solid var(--trim);border-radius:8px;padding:8px 16px;font-weight:600;cursor:pointer;min-height:44px;white-space:nowrap}
.main:disabled{opacity:.45;cursor:default}
/* modal, overlays, juice */
.modal{position:fixed;inset:0;background:#2a1a1288;display:flex;align-items:center;justify-content:center;padding:14px;z-index:30}
.dlg{background:linear-gradient(var(--panel2),var(--panel));border:1px solid var(--gold);border-radius:10px;width:100%;max-width:470px;max-height:calc(100dvh - 28px);overflow:auto;padding:14px;animation:pop .25s ease-out}
.dlg h2{font-family:var(--display);color:var(--gold);font-size:1.15rem;margin:0 0 8px}
.dlg .body{line-height:1.55}
.dlg .row{display:flex;justify-content:flex-end;margin-top:12px}
/* .modal.night backdrop: jbd KIT_BD.night (tam-cung-dem-p / tam-cung-dem) */
.scimg{position:absolute;inset:0;background-size:cover;background-position:center;pointer-events:none}
.ic{vertical-align:-3px;margin-right:3px;object-fit:contain}
.modal.night .dlg{animation:fadein 1.8s ease} /* owner s8: ONE light paper pop-up look (KIT §8); the night feel = backdrop picture + ĐÊM seal */
.modal.end .dlg{text-align:center}.modal.end .row{justify-content:center}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.fly{position:fixed;z-index:40;pointer-events:none;font-weight:700;font-size:.95rem;white-space:nowrap;background:#fffaf0;border:1px solid var(--line);border-radius:10px;padding:0 6px;animation:fly 1.5s ease-out forwards;opacity:0}
@keyframes fly{0%{opacity:0;transform:translateY(6px)}15%{opacity:1}100%{opacity:0;transform:translateY(-38px)}}
.curtain{position:fixed;inset:0;background:#f5ecdc;display:grid;place-items:center;z-index:35;opacity:0;pointer-events:none;transition:opacity .3s;font-family:var(--display);color:var(--gold);font-size:1.4rem}
.curtain.on{opacity:1}
.gold{animation:gf .9s}@keyframes gf{30%{box-shadow:inset 0 0 90px 12px #d9b25faa}}
.shake{animation:sh .45s}@keyframes sh{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.redflash{box-shadow:inset 0 0 60px #a8322a}
/* mini-games */
.ov{position:fixed;inset:0;background:#2a1a1299;display:flex;align-items:center;justify-content:center;padding:12px;z-index:32}
.mg{background:linear-gradient(var(--panel2),var(--panel));border:1px solid var(--gold);border-radius:10px;width:100%;max-width:440px;max-height:calc(100dvh - 24px);overflow:auto;padding:12px}
.mg h2{font-family:var(--display);color:var(--gold);font-size:1.1rem;margin:0}
.mg .sub{color:var(--dim);font-size:.82rem;margin:3px 0 8px}
#mgb button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 4px;cursor:pointer;min-height:44px}
#mgb button.ok{border-color:var(--good);background:#d6efdd}#mgb button.miss{border-color:var(--red);background:#f8d9d2}#mgb button.lit{background:var(--trim);color:#2a1a12}
#mgb .main{background:var(--red);color:#fff;border-color:var(--trim);padding:8px 18px}
.mgsc{text-align:center;color:var(--dim);font-size:.85rem;margin:6px 0}
.mgres{font-family:var(--display);font-size:1.5rem;color:var(--gold);text-align:center;margin:8px 0}
.lanes{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;height:min(240px,40dvh);overflow:hidden;background:#f1e2c8;border-radius:6px}
.lane{position:relative;border-left:1px solid #d2b07188;border-right:1px solid #d2b07188;cursor:pointer}
.lane i{position:absolute;left:12%;right:12%;top:-7px;height:14px;border-radius:7px;background:var(--peony);box-shadow:0 0 8px var(--peony)}
.hitline{position:absolute;left:0;right:0;height:3px;background:var(--red);pointer-events:none}
.lbtns,.simon{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.simon small,.memo small{display:block;font-size:.66rem;color:inherit;opacity:.8}
.goban{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;max-width:322px;margin:0 auto;background:#7a5a2a;padding:2px;border-radius:4px}
#mgb .goban button{aspect-ratio:1;min-height:0;padding:0;font-size:1.3rem;line-height:1;background:#e8cf98;border:0;border-radius:2px;color:#111}
#mgb .goban button.wh{color:#fff;text-shadow:0 0 2px #000}
#mgb .goban button:disabled{cursor:default}
.memo{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:330px;margin:0 auto}
#mgb .memo button{aspect-ratio:1;min-height:0;font-family:var(--display);font-size:1.4rem;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mgopts{display:flex;flex-direction:column;gap:6px}
#mgb .mgopts button{text-align:left;padding:9px 10px}
.mgq{margin:4px 0 8px;line-height:1.5}
.title{position:fixed;inset:0;z-index:50;background:var(--bg);background-image:radial-gradient(circle at 20% 10%,#fbe3e6,transparent 45%),radial-gradient(circle at 85% 90%,#e3f1ea,transparent 45%);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.tbox{width:100%;max-width:440px;text-align:center}
.tbox img{width:112px;height:112px;border-radius:22px;box-shadow:0 4px 18px #5a3a2044}
.tbox h1{font-family:var(--display);color:var(--red);font-size:1.9rem;margin:8px 0 2px}
.tbox .sub{color:var(--dim);margin:0 0 12px;font-size:.9rem}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;display:flex;flex-direction:column;gap:6px;text-align:left}
.slot b{font-family:var(--display);color:var(--gold)} .srow{display:flex;gap:6px;flex-wrap:wrap}
.menu{min-width:40px;min-height:40px;background:#fff8;border:1px solid var(--line);border-radius:8px;cursor:pointer;flex:0 0 auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.fly{opacity:1}}
.srow2{display:grid;grid-template-columns:auto 1fr;gap:4px 6px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)}.srow2 .rbtn{grid-column:1/-1}.sinfo{display:flex;flex-direction:column;font-size:.8rem;min-width:0}.sinfo span{color:var(--dim);font-size:.74rem}.md.xs{width:20px;height:20px;font-size:.6rem;vertical-align:middle;margin-right:3px}.pip{letter-spacing:1px;color:var(--gold)}
.pmap{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:5px}.pmap.two{grid-template-columns:repeat(3,1fr)}
.mtile{min-height:62px;border:1px solid var(--line);border-radius:8px;background:var(--panel2) center/cover no-repeat;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding:5px 6px;text-align:left;cursor:pointer;gap:1px;min-width:0}
.mtile b{font-family:var(--display);font-size:.82rem;color:var(--gold);line-height:1.1}.mtile span{font-size:.72rem}.mtile small{font-size:.66rem;color:#ddd}
.mtile:disabled{opacity:.45;cursor:default}.mtile.off{opacity:.35}
.reltab{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}.reltab button{min-height:36px;padding:3px 8px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--dim);cursor:pointer}.reltab button[aria-pressed=true]{background:var(--gold);color:#fff}
.rrow{display:grid;grid-template-columns:1fr auto auto;gap:6px;font-size:.8rem;padding:3px 0;border-bottom:1px solid var(--line)}
.pxc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.light{position:absolute;inset:0;pointer-events:none;z-index:0;transition:background 1.5s}
.stage::after{content:"";position:absolute;inset:0;background:#fff;opacity:var(--fl,0);pointer-events:none;z-index:2}
.stage.frost{box-shadow:inset 0 0 40px 6px #e6f2ffcc}
body[data-buoi="2"] .panel{background:color-mix(in srgb,var(--panel) 92%,#1a2a5a)}
body[data-buoi="1"] .panel{background:color-mix(in srgb,var(--panel) 95%,#ffb050)}
.tok.bob .md{animation:bob 3.2s ease-in-out infinite}.tok.enter{animation:tin .45s ease-out}
.tok:hover .md,.tok:focus .md{box-shadow:0 0 0 3px #f0d07088,0 0 14px #f0d070}
@keyframes bob{50%{transform:translateY(-3px)}}@keyframes tin{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
