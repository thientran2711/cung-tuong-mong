<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vẽ lại tranh KP23</title><!-- D1-KP23RD -->
<style>
:root{--bg:#1d1613;--card:#2b211c;--tx:#f3e6d3;--mut:#b9a58c;--gold:#e0b25a;--ok:#4caf6a;--no:#c0563f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;padding-bottom:90px}
header{position:sticky;top:0;z-index:5;background:#120d0b;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #4a382c}
header b{flex:1;min-width:160px}#cnt{color:var(--gold);font-weight:700}
button{font:inherit;font-weight:700;background:var(--gold);color:#241a10;border:0;border-radius:10px;padding:12px 18px;min-height:48px}
button.s{background:#4a382c;color:var(--tx)}
.row{margin:12px;background:var(--card);border-radius:14px;padding:10px}
.nm{font-weight:700;margin-bottom:8px}.nm small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.nt{color:#f0a070;font-size:13px;margin:-4px 0 8px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pic{margin:0}.pic figcaption{font-size:13px;color:var(--mut);margin-bottom:4px}
.pic img{width:100%;height:auto;object-fit:contain;cursor:zoom-in;border-radius:8px;background:#000;display:block}
.ch{display:flex;gap:8px;margin-top:10px}
.ch label{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;border-radius:10px;border:3px solid #4a382c;font-weight:700;cursor:pointer}
.ch input{width:30px;height:30px}
.ch label.on.k{border-color:var(--ok);background:#1f3a29}.ch label.on.r{border-color:var(--no);background:#3d1f19}
#msg{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#000;border:1px solid var(--gold);padding:12px 16px;border-radius:10px;display:none;z-index:9;max-width:90vw}
</style></head><body>
<header><b>Tranh vẽ lại ({N} cảnh) — trái: tranh cũ · phải: tranh mới<br><span style="font-weight:400;font-size:13px;color:var(--mut)">Chạm vào tranh để xem bản gốc. Mỗi cảnh tích «Giữ» hoặc «Vẽ lại».</span></b>
<span>Đã chọn: <span id="cnt">0</span>/{N}</span><button id="send">Gửi lựa chọn</button><button class="s" id="clr">Xoá hết</button></header>
<main id="m"></main><div id="msg"></div>
<script>
const B='https://ctm-img.victoria-tntt.workers.dev/img/',ROWS=/*ROWS*/[],LS='kp23-redraw-picks';
let P={};try{P=JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(P))}catch(e){}};
const m=document.getElementById('m');
function pic(cap,src,orig){const f=document.createElement('figure');f.className='pic';f.innerHTML='<figcaption></figcaption><img loading="lazy" decoding="async" alt="">';
 f.firstChild.textContent=cap;const i=f.querySelector('img');i.src=src;i.onclick=()=>window.open(orig,'_blank');return f}
ROWS.forEach(([k,n,note])=>{const r=document.createElement('div');r.className='row';
 const t=document.createElement('div');t.className='nm';t.textContent=n;const sm=document.createElement('small');sm.textContent=k;t.append(sm);r.append(t);
 if(note){const x=document.createElement('div');x.className='nt';x.textContent=note;r.append(x)}
 const p=document.createElement('div');p.className='pair';
 p.append(pic('Cũ',B+'act-'+k+'-h.webp',B+'act-'+k+'-h.webp'),pic('Mới',B+'_review/kp23-redraw/'+k+'.webp',B+'_review/kp23-redraw/'+k+'-orig.webp'));r.append(p);
 const c=document.createElement('div');c.className='ch';
 [['giu','Giữ','k'],['ve-lai','Vẽ lại','r']].forEach(([v,lab,cl])=>{const l=document.createElement('label');l.className=cl;l.innerHTML='<input type="checkbox"><span></span>';
  l.querySelector('span').textContent=lab;const i=l.querySelector('input');i.checked=P[k]===v;l.classList.toggle('on',i.checked);
  i.onchange=()=>{if(i.checked)P[k]=v;else if(P[k]===v)delete P[k];save();sync()};c.append(l)});
 r.append(c);r.dataset.k=k;m.append(r)});
function sync(){document.querySelectorAll('.row').forEach(r=>{const k=r.dataset.k;r.querySelectorAll('.ch label').forEach((l,j)=>{const v=j?'ve-lai':'giu';const on=P[k]===v;l.querySelector('input').checked=on;l.classList.toggle('on',on)})});
 document.getElementById('cnt').textContent=Object.keys(P).length}
sync();
function toast(s){const e=document.getElementById('msg');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',4000)}
document.getElementById('send').onclick=()=>{const g=[],v=[],x=[];ROWS.forEach(([k])=>{P[k]==='giu'?g.push(k):P[k]==='ve-lai'?v.push(k):x.push(k)});
 const s='KP23RD PICK: giu='+g.join(',')+' ve-lai='+v.join(',')+(x.length?' chua-chon='+x.join(','):'');
 (navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>toast('Đã chép — dán vào chat nhé.'),()=>{prompt('Chép dòng này:',s)})};
document.getElementById('clr').onclick=()=>{P={};save();sync()};
</script></body></html>
