<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Duyệt tranh phòng</title>
<style>
:root{--bg:#1d1613;--card:#2b211c;--tx:#f3e6d3;--mut:#b9a58c;--gold:#e0b25a;--ok:#4caf6a;--no:#d4584a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;padding-bottom:90px}
header{position:sticky;top:0;z-index:5;background:#120d0b;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #4a382c}
header b{flex:1;min-width:160px}#cnt{color:var(--gold);font-weight:700}
button{font:inherit;font-weight:700;background:var(--gold);color:#241a10;border:0;border-radius:10px;padding:12px 18px;min-height:48px}
button.s{background:#4a382c;color:var(--tx)}
h2{margin:22px 12px 6px;color:var(--gold);font-size:20px}h2 small{color:var(--mut);font-weight:400;font-size:14px}
.row{margin:12px;background:var(--card);border-radius:14px;padding:10px;border:3px solid transparent}
.row.ok{border-color:var(--ok)}.row.no{border-color:var(--no)}
.row img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:10px;background:#000;display:block}
.nm{font-weight:700;font-size:20px;margin:10px 2px 2px}.nm .lv{color:var(--ok);font-size:13px;margin-left:8px}
.sm{color:var(--mut);font-size:12px;margin:0 2px 8px;word-break:break-all}
.tk{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tk label{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;border-radius:10px;background:#3a2c24;font-weight:700;font-size:18px;cursor:pointer}
.tk input{width:34px;height:34px}.tk .a input{accent-color:var(--ok)}.tk .b input{accent-color:var(--no)}
.tk .a.on{background:#1f3a29;outline:3px solid var(--ok)}.tk .b.on{background:#43201c;outline:3px solid var(--no)}
.note{width:100%;margin-top:8px;padding:10px;border-radius:8px;border:1px solid #4a382c;background:#1a1411;color:var(--tx);font:inherit}
#msg{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#000;border:1px solid var(--gold);padding:12px 16px;border-radius:10px;display:none;z-index:9;max-width:90vw}
</style></head><body>
<header><b>Duyệt tranh phòng<br><span style="font-weight:400;font-size:13px;color:var(--mut)">Tích «Duyệt» hoặc «Không duyệt» dưới mỗi tranh (không tích = chưa chọn). Bấm «Gửi lựa chọn» rồi dán vào chat chính.</span></b>
