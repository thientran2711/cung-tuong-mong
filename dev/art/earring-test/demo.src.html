<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thử trang sức</title>
<style>
:root{--bg:#f4f0ee;--ink:#3a2a2a;--accent:#a8324a;--card:#fffaf7;--line:#e2d6d0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,"Noto Sans",sans-serif}
h1{font-size:20px;margin:12px 16px 4px}
p.sub{margin:0 16px 10px;font-size:14px;opacity:.8}
.wrap{display:grid;grid-template-columns:1fr;gap:14px;padding:0 16px 20px}
.wrap{max-width:1200px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.cap{font-size:24px;font-weight:700;margin:2px 4px 8px}
.cap small{display:block;font-size:14px;font-weight:400;opacity:.75}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:0 4px 10px}
button{font-size:16px;padding:9px 14px;border-radius:999px;border:2px solid var(--accent);background:#fff;color:var(--accent);cursor:pointer;font-weight:600}
button.on{background:var(--accent);color:#fff}
.views{display:flex;gap:8px;align-items:flex-start}
.vw{position:relative;overflow:hidden;border-radius:10px;border:1px solid var(--line);
  background-color:#fff;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);
  background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
.vw .lbl{position:absolute;left:6px;top:6px;z-index:5;background:rgba(255,255,255,.85);border-radius:6px;padding:2px 7px;font-size:13px}
.stage{position:absolute;left:0;top:0;width:1024px;height:2304px;transform-origin:0 0}
.stage img{position:absolute;display:block}
.stage .item{display:none}
.stage.w-earring .earring,.stage.w-ngoc_boi .ngoc_boi,.stage.w-tui_huong .tui_huong{display:block}
</style>
</head>
<body>
<h1>Thử trang sức: hoa tai · ngọc bội · túi hương</h1>
<p class="sub">Mặt chính diện (FF) đeo đôi hoa tai; mặt nghiêng 3/4 tai gần đeo đủ, tai xa nhỏ hơn và khuất sau má. Ngọc bội, túi hương treo ở dải lưng; khi tay che bụng thì dây luồn sau tay.</p>
<div class="wrap" id="wrap"></div>
<script>
/*DATA*/
const NAMES={earring:['Đeo hoa tai','Tháo hoa tai'],ngoc_boi:['Đeo ngọc bội','Tháo ngọc bội'],tui_huong:['Đeo túi hương','Tháo túi hương']};
const ANG={FF:'FF (chính diện)','3/4':'3/4 (nghiêng)'};
function addItem(st,kind,pt,mirror,scale){
  const it=A.items[kind],im=new Image();im.src=IMG[kind];im.className='item '+kind;
  im.onload=()=>{const h=it.h*(scale||1),w=h*im.naturalWidth/im.naturalHeight;
    const ax=mirror?1-it.anchor[0]:it.anchor[0];
    im.style.height=h+'px';im.style.width=w+'px';
    im.style.left=(pt[0]-ax*w)+'px';im.style.top=(pt[1]-it.anchor[1]*h)+'px';
    if(mirror)im.style.transform='scaleX(-1)';};
  st.appendChild(im);
}
const stages=[];
function makeView(id,f,box,label){
  const vw=document.createElement('div');vw.className='vw';vw.style.flex=(box[2]/box[3]).toFixed(3);vw.style.aspectRatio=box[2]+'/'+box[3];
  vw.innerHTML='<span class="lbl">'+label+'</span>';
  const st=document.createElement('div');st.className='stage';
  const fig=new Image();fig.src=FIG[id];fig.style.left='0';fig.style.top='0';fig.style.width='1024px';fig.style.height='2304px';st.appendChild(fig);
  for(const p of f.place)addItem(st,p.item,p.pt,!!p.mirror,p.scale);
  for(const o of f.occ){const im=new Image();im.src=OCC[o.file];im.className='occ';im.style.left=o.x+'px';im.style.top=o.y+'px';st.appendChild(im);}
  vw.appendChild(st);stages.push({vw,st,box});return vw;
}
function fit(){for(const s of stages){const k=s.vw.clientWidth/s.box[2];s.st.style.transform=`scale(${k}) translate(${-s.box[0]}px,${-s.box[1]}px)`;}}
for(const [id,f] of Object.entries(A.figures)){
  const c=document.createElement('div');c.className='card';c.id='card-'+id;
  c.innerHTML=`<div class="cap">${id} · ${f.group} · góc ${ANG[f.angle]}<small>${f.sub}</small></div>`;
  const b=document.createElement('div');b.className='btns';c.appendChild(b);
  const v=document.createElement('div');v.className='views';c.appendChild(v);
  const vs=[makeView(id,f,f.head_view,'Cận mặt'),makeView(id,f,f.waist_view,'Dải lưng'),makeView(id,f,[0,0,1024,2304],'Toàn thân')];
  vs.forEach(x=>v.appendChild(x));
  for(const k of ['earring','ngoc_boi','tui_huong']){
    const bt=document.createElement('button');bt.textContent=NAMES[k][0];bt.dataset.k=k;
    bt.onclick=()=>{const on=!bt.classList.contains('on');bt.classList.toggle('on',on);bt.textContent=NAMES[k][on?1:0];
      for(const s of vs)s.querySelector('.stage').classList.toggle('w-'+k,on);};
    b.appendChild(bt);
  }
  document.getElementById('wrap').appendChild(c);
}
fit();addEventListener('resize',fit);new ResizeObserver(fit).observe(document.body);
</script>
</body>
</html>
