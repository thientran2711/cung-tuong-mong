<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PlayCanvas tray trial</title>
<style>html,body{margin:0;height:100%;background:#1a0f0a;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;left:8px;top:8px;color:#f3d9a0;font:12px/1.3 monospace;pointer-events:none;display:none}
#btn{position:fixed;right:10px;bottom:10px;padding:10px 16px;background:#8a1c1c;color:#f8e4b0;border:1px solid #d9b25a;border-radius:8px;font:15px serif;display:none}
body.ui #btn,body.ui #hud{display:block}</style></head>
<body><canvas id="c"></canvas><div id="hud"></div><button id="btn">Replay</button>
<script type="module" src="main.js"></script></body></html>
